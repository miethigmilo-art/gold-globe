<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Globe — AI Market Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="load-orb"></div>
  <div class="load-text">
    <span class="load-title">GOLD GLOBE</span>
    <span class="load-sub">Lade KI-Analysen & Weltdaten</span>
  </div>
</div>

<!-- Globe -->
<div id="globe-container">
  <div id="globe-wrap"></div>

  <!-- Legend -->
  <div id="legend">
    <div class="legend-title">Einfluss auf Gold</div>
    <div class="legend-item"><div class="legend-color" style="background:#00aa44"></div><span>Sehr bullish</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#88cc00"></div><span>Bullish</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#ffcc00"></div><span>Neutral</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#ff6600"></div><span>Bearish</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#cc2200"></div><span>Sehr bearish</span></div>
  </div>
</div>

<!-- Resize Handle -->
<div id="resize-handle"></div>

<!-- Sidebar -->
<div id="sidebar">

  <!-- Header -->
  <div id="header">
    <div class="header-mark">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="9" r="7" stroke="#d4a843" stroke-width="1.5"/>
        <circle cx="9" cy="9" r="3" fill="#d4a843"/>
        <line x1="9" y1="2" x2="9" y2="0" stroke="#d4a843" stroke-width="1.5"/>
        <line x1="9" y1="18" x2="9" y2="16" stroke="#d4a843" stroke-width="1.5"/>
        <line x1="2" y1="9" x2="0" y2="9" stroke="#d4a843" stroke-width="1.5"/>
        <line x1="18" y1="9" x2="16" y2="9" stroke="#d4a843" stroke-width="1.5"/>
      </svg>
      <span class="header-title">GOLD GLOBE</span>
    </div>
    <div class="header-sub">AI Market Intelligence</div>
  </div>

  <!-- Ticker Switcher -->
  <div id="ticker-bar">
    <button class="ticker-btn active" data-ticker="GC=F">GOLD</button>
    <button class="ticker-btn" data-ticker="SI=F">SILVER</button>
    <button class="ticker-btn" data-ticker="CL=F">OIL</button>
    <button class="ticker-btn" data-ticker="SPY">S&P500</button>
    <button class="ticker-btn" data-ticker="BTC-USD">BTC</button>
    <button class="ticker-btn" data-ticker="NVDA">NVDA</button>
  </div>

  <!-- Price Panel -->
  <div id="price-panel">
    <div class="price-label" id="price-label">XAU / USD</div>
    <div id="price-display">
      <div id="gold-price-value">—</div>
      <div id="gold-price-change"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div id="tabs">
    <div class="tab active" data-tab="events">Events</div>
    <div class="tab" data-tab="signal">Signal</div>
    <div class="tab" data-tab="dashboard">Bot</div>
  </div>

  <!-- Events Tab -->
  <div class="tab-content active" id="tab-events">
    <div id="events-list">
      <div class="loading-msg">Lade Events...</div>
    </div>
  </div>

  <!-- Signal Tab -->
  <div class="tab-content" id="tab-signal">
    <div style="padding:12px 0">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <select id="signal-strategie" style="flex:1;background:#0a1628;border:1px solid #1e3a5a;color:#c0d0e8;padding:6px 8px;border-radius:6px;font-size:12px">
          <option value="goldglobe">GoldGlobe KI</option>
          <option value="mittel">Mittel</option>
          <option value="aggressiv">Aggressiv</option>
        </select>
        <button onclick="sendSignal(true)" style="background:rgba(60,100,160,0.2);border:1px solid #1e3a5a;color:#8090a8;padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer">Dry Run</button>
        <button onclick="sendSignal(false)" style="background:rgba(68,204,136,0.15);border:1px solid #44cc88;color:#44cc88;padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer">Signal</button>
      </div>
      <div id="signal-output" style="font-size:12px;min-height:60px"></div>
      <div id="signal-log" style="font-size:10px;color:#4a6080;margin-top:8px;max-height:120px;overflow-y:auto"></div>
    </div>
  </div>

  <!-- Bot Tab -->
  <div class="tab-content" id="tab-dashboard">
    <iframe
      src="https://trading-bot-production-86d8.up.railway.app/dashboard"
      style="width:100%;height:100%;border:none;background:#060810"
      title="Trading Bot Dashboard">
    </iframe>
  </div>

</div>

<!-- Country Popup -->
<div id="popup">
  <div id="popup-header">
    <div id="popup-title">Land</div>
    <button id="popup-close" onclick="closePopup()">✕</button>
  </div>
  <div id="popup-body">
    <div class="popup-loading">Analysiere...</div>
  </div>
</div>

<script src="https://unpkg.com/globe.gl@2.30.0/dist/globe.gl.min.js"></script>
<script src="app.js"></script>
</body>
</html>
